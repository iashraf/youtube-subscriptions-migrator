services:
  migrator:
    build: .
    init: true
    environment:
      SOURCE_ALIAS: ${SOURCE_ALIAS:-source (configured alias)}
      DESTINATION_ALIAS: ${DESTINATION_ALIAS:-destination (configured alias)}
      OAUTH_PORT: ${OAUTH_PORT:-8080}
      API_INTERVAL: ${API_INTERVAL:-0.2}
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
